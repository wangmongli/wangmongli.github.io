<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e90ff">
<title>蓝色爱心 · 点我收祝福 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #041c3d 0%, #0a3d73 22%, #0b5f9e 48%, #1e90ff 72%, #7ec8f0 100%);
    background-attachment: fixed;
    color: #fff;
    user-select: none;
    touch-action: manipulation;
    position: relative;
    overflow: hidden;
  }

  .glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .4; pointer-events: none; }
  .glow.g1 { width: 340px; height: 340px; background: #1e90ff; top: -80px; left: -60px; }
  .glow.g2 { width: 280px; height: 280px; background: #00b4d8; bottom: -60px; right: -40px; }
  .glow.g3 { width: 200px; height: 200px; background: #4facfe; top: 40%; left: 62%; }

  .hearts-layer, .fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }

  .heart {
    position: absolute; top: 102%; pointer-events: auto; cursor: pointer;
    will-change: transform, opacity;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 4px 10px rgba(0,60,120,.45));
    transition: filter .15s ease;
  }
  .heart svg { width: 100%; height: 100%; display: block; }
  .heart:active { filter: drop-shadow(0 2px 5px rgba(0,40,90,.5)); }

  @keyframes floatUp {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    20%  { transform: translate(var(--sway), -26vh) rotate(7deg); }
    45%  { transform: translate(calc(var(--sway) * -1.1), -52vh) rotate(-6deg); }
    70%  { transform: translate(var(--sway), -78vh) rotate(8deg); }
    100% { transform: translate(0, -135vh) rotate(-8deg); }
  }

  .header { position: absolute; top: 0; left: 0; right: 0; z-index: 6; text-align: center; padding: calc(18px + env(safe-area-inset-top)) 16px 12px; pointer-events: none; }
  .header h1 { font-size: clamp(24px, 6vw, 42px); letter-spacing: 2px; text-shadow: 0 3px 12px rgba(0,20,50,.45); }
  .header p { margin-top: 6px; font-size: clamp(13px, 3.6vw, 17px); opacity: .94; text-shadow: 0 2px 8px rgba(0,20,50,.4); }

  .score { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; z-index: 6;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,20,50,.22); }
  .score b { font-size: 17px; margin-left: 3px; color: #caf0f8; }

  .combo-badge { position: absolute; top: calc(64px + env(safe-area-inset-top)); right: 16px; z-index: 6;
    background: linear-gradient(135deg, #4facfe, #00b4d8); color: #fff;
    padding: 6px 13px; border-radius: 999px; font-size: 15px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(0,60,120,.35); opacity: 0; transform: scale(.6);
    transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .combo-badge.show { opacity: 1; transform: scale(1); }

  .toast { position: absolute; left: 50%; top: 50%; z-index: 8; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    background: linear-gradient(135deg, #4facfe, #1e90ff 55%, #0b5f9e); border: 2px solid rgba(255,255,255,.65); border-radius: 22px;
    padding: 26px 30px; max-width: 82vw; text-align: center; box-shadow: 0 18px 50px rgba(0,30,70,.45);
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s ease; }
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .toast .icon { font-size: 34px; }
  .toast .msg { font-size: clamp(18px, 5.4vw, 26px); font-weight: 800; margin-top: 8px; line-height: 1.4; }
  .toast .sub { font-size: 13px; opacity: .92; margin-top: 10px; }

  .bubble { position: absolute; z-index: 7; pointer-events: none; background: rgba(255,255,255,.96); color: #0b5f9e;
    padding: 9px 16px; border-radius: 18px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 22px rgba(0,30,70,.3);
    white-space: nowrap; animation: bubbleUp 2.4s ease-out forwards; }
  @keyframes bubbleUp { 0% { transform: translate(-50%, 0) scale(.4); opacity: 0; } 12% { transform: translate(-50%, -12px) scale(1.05); opacity: 1; } 80% { transform: translate(-50%, -120px) scale(1); opacity: 1; } 100% { transform: translate(-50%, -160px) scale(.9); opacity: 0; } }

  .particle { position: absolute; z-index: 5; pointer-events: none; will-change: transform, opacity; }

  .actions { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 12px; justify-content: center; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); pointer-events: none; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.5); color: #fff; font-size: 15px; font-weight: 700; padding: 11px 22px; border-radius: 999px; backdrop-filter: blur(6px); box-shadow: 0 6px 16px rgba(0,30,70,.25); transition: transform .12s ease, background .2s ease; }
  .btn:active { transform: scale(.94); background: rgba(255,255,255,.32); }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>

  <div class="hearts-layer" id="heartsLayer"></div>
  <div class="fx-layer" id="fxLayer"></div>

  <header class="header">
    <h1>蓝色爱心 💙</h1>
    <p>点一点爱心，收下祝福 💌</p>
  </header>

  <div class="score">💙 得分 <b id="score">0</b></div>
  <div class="combo-badge" id="comboBadge">连击 ×1</div>

  <div class="toast" id="toast">
    <div class="icon">💙</div>
    <div class="msg" id="toastMsg">愿你如蓝海般辽阔！</div>
    <div class="sub">— 送给你 —</div>
  </div>

  <div class="actions">
    <button class="btn" id="btnMore">✨ 更多爱心</button>
    <button class="btn" id="btnBless">🎁 收祝福</button>
  </div>

<script>
(function () {
  var BLESSINGS = [
    "愿你如蓝海般辽阔，心怀远方！",
    "愿你像天空一样晴朗，天天好心情！",
    "心想事成，万事胜意！",
    "考试全过，高分上岸！",
    "平安喜乐，岁岁无忧！",
    "愿你眼里有星辰大海！",
    "好运连连，前程似锦！",
    "愿你被世界温柔以待！",
    "天天开心，笑口常开！",
    "愿你乘风破浪，未来可期！",
    "健康平安，幸福美满！",
    "所行皆坦途，所遇皆良人！",
    "愿你梦想成真，闪闪发光！",
    "蓝蓝的天，蓝蓝的心情，一切都好！",
    "愿你无忧无虑，光芒万丈！",
    "生活甜甜，好运连连！",
    "愿你如鱼得水，海阔天空！",
    "今天也要元气满满！",
    "所有的美好都向你奔赴而来！",
    "愿你一生温暖纯良，不舍爱与自由！",
    "岁岁常欢愉，年年皆胜意！",
    "愿你诸事顺遂，笑靥如花！",
    "越来越好，越来越棒！",
    "未来可期，一起加油！"
  ];

  var HEART_COLORS = ["#003566", "#014f86", "#0a4da3", "#1e5aa8", "#1e90ff", "#2a9df4", "#4facfe", "#38b6ff", "#0096c7", "#00b4d8", "#48cae4", "#5bc0eb", "#7ec8f0", "#90e0ef"];
  var PARTICLE_COLORS = ["#ffffff", "#caf0f8", "#90e0ef", "#ade8f4", "#48cae4", "#4facfe", "#9eeaf9"];

  var heartsLayer = document.getElementById("heartsLayer");
  var fxLayer = document.getElementById("fxLayer");
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var scoreEl = document.getElementById("score");
  var comboBadge = document.getElementById("comboBadge");
  var score = 0, combo = 0, lastHit = 0, comboTimer = null;

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function heartSVG(color) {
    return '<svg viewBox="0 0 32 29.6"><path d="M16 29.6 C14.8 28.2 0 19.5 0 9.6 C0 4.3 4.3 0 9.6 0 C12.7 0 15.4 1.6 16 3.8 C16.6 1.6 19.3 0 22.4 0 C27.7 0 32 4.3 32 9.6 C32 19.5 17.2 28.2 16 29.6 Z" fill="' + color + '"/></svg>';
  }

  function spawnHeart() {
    var el = document.createElement("div");
    el.className = "heart";
    var size = 16 + Math.random() * 36;
    var duration = 7 + Math.random() * 8;
    el.style.width = size + "px";
    el.style.height = Math.round(size * 0.925) + "px";
    el.style.left = (2 + Math.random() * 94) + "vw";
    el.style.setProperty("--sway", ((Math.random() * 2 - 1) * 46).toFixed(1) + "px");
    el.style.animationDuration = duration + "s";
    el.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
    el.style.zIndex = Math.round(size);
    el.innerHTML = heartSVG(pick(HEART_COLORS));
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      var r = el.getBoundingClientRect();
      burst(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2, el);
    });
    heartsLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, (duration + 1) * 1000);
    return el;
  }

  var HEART_TARGET = 28;
  function ensureHearts() { while (heartsLayer.children.length < HEART_TARGET) spawnHeart(); }
  ensureHearts();
  setInterval(ensureHearts, 650);

  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 24); } catch (e) {} }

  function updateCombo() {
    var now = Date.now();
    if (now - lastHit < 1400) { combo++; } else { combo = 1; }
    lastHit = now;
    score += combo;
    scoreEl.textContent = score;
    if (combo >= 2) {
      comboBadge.textContent = "连击 ×" + combo;
      comboBadge.classList.add("show");
      clearTimeout(comboTimer);
      comboTimer = setTimeout(function () { comboBadge.classList.remove("show"); }, 1200);
    } else {
      comboBadge.classList.remove("show");
    }
  }

  function burst(x, y, sourceEl) {
    vibrate(26);
    updateCombo();
    var n = 14 + Math.floor(Math.random() * 8);
    for (var i = 0; i < n; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      var isHeart = Math.random() < 0.35;
      var ps = 8 + Math.random() * 14;
      if (isHeart) {
        p.innerHTML = heartSVG(pick(HEART_COLORS));
        p.style.width = ps + "px";
        p.style.height = Math.round(ps * 0.925) + "px";
      } else {
        p.textContent = Math.random() < 0.5 ? "✨" : "💙";
        p.style.fontSize = ps + "px";
        p.style.lineHeight = 1;
      }
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.opacity = "1";
      fxLayer.appendChild(p);

      var angle = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 90;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 30;
      var rot = (Math.random() * 2 - 1) * 260;

      p.animate([
        { transform: "translate(-50%, -50%) translate(0px,0px) scale(1) rotate(0deg)", opacity: 1 },
        { transform: "translate(-50%, -50%) translate(" + dx + "px," + dy + "px) scale(.2) rotate(" + rot + "deg)", opacity: 0 }
      ], { duration: 600 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" })
       .onfinish = function () { p.remove(); };
    }

    if (sourceEl) {
      sourceEl.style.transition = "transform .18s ease, opacity .18s ease";
      sourceEl.style.transform = "scale(2.4)";
      sourceEl.style.opacity = "0";
      setTimeout(function () { sourceEl.remove(); }, 190);
    }

    showBubble(x, y);
    showToast();
  }

  function showBubble(x, y) {
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = pick(BLESSINGS);
    b.style.left = Math.min(Math.max(x, 90), window.innerWidth - 90) + "px";
    b.style.top = Math.max(y, 70) + "px";
    fxLayer.appendChild(b);
    setTimeout(function () { b.remove(); }, 2500);
  }

  var toastTimer = null;
  function showToast() {
    toastMsg.textContent = pick(BLESSINGS);
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  document.getElementById("btnBless").addEventListener("click", function () {
    showToast();
    score++;
    scoreEl.textContent = score;
    vibrate(24);
  });

  document.getElementById("btnMore").addEventListener("click", function () {
    for (var i = 0; i < 8; i++) spawnHeart();
    vibrate(20);
  });

  document.body.addEventListener("pointerdown", function (e) {
    if (e.target === heartsLayer || e.target === document.body || e.target.classList.contains("glow")) {
      var x = e.clientX, y = e.clientY;
      var el = document.createElement("div");
      el.className = "heart";
      var size = 20 + Math.random() * 26;
      el.style.width = size + "px";
      el.style.height = Math.round(size * 0.925) + "px";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.setProperty("--sway", "0px");
      el.style.animation = "floatUp " + (6 + Math.random() * 5) + "s linear forwards";
      el.style.opacity = "0.9";
      el.innerHTML = heartSVG(pick(HEART_COLORS));
      el.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        burst(ev.clientX, ev.clientY, el);
      });
      heartsLayer.appendChild(el);
      setTimeout(function () { el.remove(); }, 12000);
    }
  });
})();
</script>
</body>
</html>
